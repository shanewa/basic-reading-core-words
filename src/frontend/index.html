<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Garden</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=20260529i" />
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>

    <header class="topbar">
      <h1 id="title">Word Garden</h1>
      <div class="progress-mini" id="progressMini" aria-label="Learning progress summary">
        <span class="pm-item"><b id="pmReviewed">0</b><small>Today</small></span>
        <span class="pm-item"><b id="pmDue">0</b><small>Due</small></span>
        <span class="pm-item"><b id="pmAcc">0%</b><small>Accuracy</small></span>
      </div>
      <div class="top-actions">
        <button id="langBtn" class="ghost-btn">中文 / EN</button>
        <button id="settingsToggleBtn" class="ghost-btn">Settings</button>
      </div>
    </header>

    <main class="layout">
      <section class="card" id="learnCard">
        <div class="section-head">
          <h2 id="learnTitle">学习 Learn</h2>
          <div class="section-head-right">
            <button id="favoriteBtn" class="icon-btn favorite-btn" aria-label="收藏 Favorite" title="收藏 Favorite" disabled>
              <svg id="favoriteIcon" class="star-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path class="star-path" d="M12 2.5l2.95 6.36 7.05.74-5.3 4.86 1.57 7.04L12 17.9l-6.27 3.6 1.57-7.04L2 9.6l7.05-.74L12 2.5z" />
              </svg>
            </button>
            <span id="progressBadge" class="badge">0 / 20</span>
          </div>
        </div>

        <div id="questionBox" class="question-box">
          <div class="initial-loading" id="initialLoading">
            <div class="loading-lottie" id="loadingLottie"></div>
            <p class="muted">加载中...</p>
          </div>
        </div>

        <div class="actions">
          <button id="prevBtn" class="secondary-btn" disabled>上一题 Prev</button>
          <button id="submitBtn" class="primary-btn">提交 Submit</button>
          <button id="nextBtn" class="secondary-btn">下一题 Next</button>
        </div>
        <p id="feedback" class="feedback"></p>
      </section>
    </main>

    <aside id="settingsPanel" class="settings-panel hidden" aria-hidden="true">
      <div class="settings-head">
        <h2 id="settingsTitle">设置 Settings</h2>
        <button id="settingsCloseBtn" class="ghost-btn">Close</button>
      </div>

      <label>
        Book
        <select id="bookSelect"></select>
      </label>

      <label>
        Daily Target
        <input id="dailyTarget" type="number" min="1" max="100" />
      </label>

      <div class="mode-grid">
        <label><input type="checkbox" id="modeMeaning" /> Meaning</label>
        <label><input type="checkbox" id="modeImage" /> Image</label>
        <label><input type="checkbox" id="modeTyping" /> Typing</label>
      </div>

      <label>
        Typing Style
        <select id="typingMode">
          <option value="missing_one_vowel">上部分省略</option>
          <option value="missing_multi_vowels" selected>缺失部分自然拼读（默认）</option>
          <option value="all_missing">全部字母缺失</option>
        </select>
      </label>

      <label>
        下一题等待时间 (ms)
        <input id="answerDelayMs" type="number" min="100" max="1000" step="50" value="200" />
      </label>

      <div class="actions compact">
        <button id="saveSettingsBtn" class="primary-btn">保存 Save</button>
        <button id="rebuildBtn" class="secondary-btn">Rebuild Wordbank</button>
      </div>

      <div class="actions compact">
        <button id="resetProgressBtn" class="danger-btn">重置进度 Reset</button>
      </div>
    </aside>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="/app.js?v=20260529i"></script>
  </body>
</html>
